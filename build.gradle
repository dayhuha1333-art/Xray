buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/maven" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

version = "1.0.0"
group = "com.example.xraymod"
archivesBaseName = "xraymod"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2855"
    runDir = "run"
    mappings = "snapshot_20171003"
}

repositories {
    maven { url "https://maven.cleanroommc.com" }
}

dependencies {
    compile('zone.rong:mixinbooter:10.7') {
        transitive = false
    }
    annotationProcessor('zone.rong:mixinbooter:10.7') {
        transitive = false
    }
}

mixin {
    add sourceSets.main, "mixins.xraymod.refmap.json"
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
}
