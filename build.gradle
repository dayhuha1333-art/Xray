buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'com.example.xraymod'
archivesBaseName = 'xraymod'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            mods { xraymod { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    // CleanroomMC ТОЛЬКО для MixinBooter, чтобы authlib шёл с forge/mavenCentral
    maven {
        url = 'https://maven.cleanroommc.com'
        content {
            includeGroup 'zone.rong'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.ow2.asm:asm:5.2'
        force 'org.ow2.asm:asm-debug-all:5.2'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    
    implementation ('zone.rong:mixinbooter:10.7') {
        transitive = false
    }
    annotationProcessor ('zone.rong:mixinbooter:10.7') {
        transitive = false
    }
    
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
}

jar.finalizedBy('reobfJar')

jar {
    manifest {
        attributes(
            "MixinConfigs": "mixins.xraymod.json"
        )
    }
}
